<title>Agent-Brain Knowledge Graph</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  #graph-wrap { position: relative; flex: 1; }
  #graph-svg { width: 100%; height: 100%; background: #fafafa; cursor: grab; touch-action: none; }
  #graph-svg:active { cursor: grabbing; }
  .node { cursor: grab; }
  .node .label { font-size: 11px; fill: #111827; pointer-events: none; }
  /* Source-code leaves are numerous and individually low-value at a glance —
     hidden by default so the graph reads as a diagram instead of a wall of
     overlapping text. Revealed on hover, or for whatever the current
     selection highlights (see highlight() in the script below). */
  .node-source .label { display: none; }
  .node-source:hover .label, .node-source.show-label .label { display: block; }
  .node.unreachable circle, .node.unreachable rect { stroke: #dc2626; stroke-width: 3; }
  .node.dimmed, .edge.dimmed { opacity: 0.15; }
  .edge { stroke: #9ca3af; stroke-width: 1.5; }
  .edge-related { stroke: #7c3aed; }
  .edge-sources { stroke: #9ca3af; }
  .entry-anchor { stroke: #9ca3af; stroke-width: 1.5; }
  .entry-anchor .anchor-label { font-size: 10px; fill: #9ca3af; stroke: none; }
  .ring-guide { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4,4; }
  .ring-unreachable { stroke: #dc2626; opacity: 0.3; }
  .ring-label { font-size: 10px; fill: #9ca3af; pointer-events: none; }
  #hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: #6b7280; background: rgba(255,255,255,0.85); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  #reset-view { position: absolute; right: 12px; bottom: 12px; font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
  #reset-view:hover { background: #f3f4f6; }
  #sidebar { width: 300px; border-left: 1px solid #e5e7eb; padding: 16px; overflow-y: auto; }
  #legend { font-size: 12px; margin-bottom: 16px; }
  #legend div { margin: 4px 0; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
  #detail-panel .field { font-size: 13px; margin: 4px 0; word-break: break-word; }
  #empty-state { padding: 24px; }
</style>

<script>
(function () {
  var raw = document.getElementById('graph-data').textContent;
  var GRAPH = JSON.parse(raw);
  var nodesById = {};
  GRAPH.nodes.forEach(function (n) { nodesById[n.id] = n; });

  var svg = document.getElementById('graph-svg');
  var viewport = document.getElementById('viewport');
  var panel = document.getElementById('detail-panel');
  var resetBtn = document.getElementById('reset-view');

  function fieldRow(label, value) {
    if (value === null || value === undefined || value === '') return null;
    var row = document.createElement('div');
    row.className = 'field';
    var strong = document.createElement('strong');
    strong.textContent = label + ': ';
    row.appendChild(strong);
    var span = document.createElement('span');
    span.textContent = value;
    row.appendChild(span);
    return row;
  }

  function showDetail(node) {
    panel.innerHTML = '';
    panel.hidden = false;
    var h = document.createElement('h2');
    h.textContent = node.label;
    panel.appendChild(h);
    [
      ['id', node.id], ['path', node.path], ['type', node.type],
      ['layer', node.layer], ['status', node.status], ['owner', node.owner],
      ['tokens_est', node.tokens_est], ['covers', node.covers], ['excludes', node.excludes],
    ].forEach(function (pair) {
      var row = fieldRow(pair[0], pair[1]);
      if (row) panel.appendChild(row);
    });
  }

  function connectedIds(id) {
    var ids = {};
    ids[id] = true;
    GRAPH.edges.forEach(function (e) {
      if (e.from === id) ids[e.to] = true;
      if (e.to === id) ids[e.from] = true;
    });
    return ids;
  }

  // Selecting a node dims everything unrelated AND reveals the labels of any
  // connected source-code leaf (those are hidden by default — see CSS — since
  // a repo with hundreds of source files renders as an unreadable wall of
  // overlapping text otherwise). Clearing the selection hides them again.
  function highlight(id) {
    var connected = connectedIds(id);
    svg.querySelectorAll('.node').forEach(function (g) {
      var on = !!connected[g.getAttribute('data-id')];
      g.classList.toggle('dimmed', !on);
      g.classList.toggle('show-label', on);
    });
    svg.querySelectorAll('.edge').forEach(function (l) {
      var on = l.getAttribute('data-from') === id || l.getAttribute('data-to') === id;
      l.classList.toggle('dimmed', !on);
    });
  }

  function clearHighlight() {
    svg.querySelectorAll('.dimmed, .show-label').forEach(function (el) {
      el.classList.remove('dimmed', 'show-label');
    });
  }

  function clearSelection() {
    clearHighlight();
    panel.hidden = true;
  }

  // --- Pan & zoom -----------------------------------------------------
  // A transform on #viewport, not on #graph-svg's viewBox: node/edge
  // coordinates (baked in at render time by layout.js) stay in one fixed
  // coordinate space, so drag math and highlight logic never need to know
  // the current zoom level.
  var scale = 1, tx = 0, ty = 0;
  var MIN_SCALE = 0.15, MAX_SCALE = 8;

  function applyTransform() {
    viewport.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')');
  }

  function resetView() {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  }
  if (resetBtn) resetBtn.addEventListener('click', resetView);

  // Mouse wheel and trackpad two-finger scroll both fire 'wheel' events —
  // zoom on either, centered on the cursor so the point under it stays put.
  svg.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var pt = svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    var factor = Math.exp(-ev.deltaY * 0.0015);
    var next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    tx = p.x - (p.x - tx) * (next / scale);
    ty = p.y - (p.y - ty) * (next / scale);
    scale = next;
    applyTransform();
  }, { passive: false });

  // --- Drag (node) vs. pan (blank canvas) vs. click-to-deselect -------
  var dragging = null;      // node being dragged
  var dragMoved = false;
  var panning = false;      // background drag = canvas pan
  var panMoved = false;
  var panStart = null;
  var panOrigin = null;

  svg.addEventListener('pointerdown', function (ev) {
    var g = ev.target.closest('.node');
    if (g) {
      dragging = g;
      dragMoved = false;
      g.setPointerCapture(ev.pointerId);
      return;
    }
    panning = true;
    panMoved = false;
    panStart = { x: ev.clientX, y: ev.clientY };
    panOrigin = { tx: tx, ty: ty };
    svg.setPointerCapture(ev.pointerId);
  });

  svg.addEventListener('pointermove', function (ev) {
    if (dragging) {
      dragMoved = true;
      var pt = svg.createSVGPoint();
      pt.x = ev.clientX;
      pt.y = ev.clientY;
      // Node transforms live inside #viewport's local space, so drag math
      // must invert THAT element's screen matrix, not the outer <svg>'s —
      // otherwise dragging drifts from the cursor as soon as scale !== 1.
      var loc = pt.matrixTransform(viewport.getScreenCTM().inverse());
      var id = dragging.getAttribute('data-id');
      dragging.setAttribute('transform', 'translate(' + loc.x + ',' + loc.y + ')');
      svg.querySelectorAll('.edge[data-from="' + id + '"]').forEach(function (l) {
        l.setAttribute('x1', loc.x);
        l.setAttribute('y1', loc.y);
      });
      svg.querySelectorAll('.edge[data-to="' + id + '"]').forEach(function (l) {
        l.setAttribute('x2', loc.x);
        l.setAttribute('y2', loc.y);
      });
      return;
    }
    if (panning) {
      var dx = ev.clientX - panStart.x;
      var dy = ev.clientY - panStart.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) panMoved = true;
      var ctm = svg.getScreenCTM();
      tx = panOrigin.tx + dx / ctm.a;
      ty = panOrigin.ty + dy / ctm.d;
      applyTransform();
    }
  });

  svg.addEventListener('pointerup', function () {
    if (dragging) {
      var g = dragging;
      dragging = null;
      if (!dragMoved) {
        var id = g.getAttribute('data-id');
        highlight(id);
        showDetail(nodesById[id]);
      }
      return;
    }
    if (panning) {
      panning = false;
      // A background pointerdown that never moved is a click on blank
      // canvas, not a pan — that's what clears the current selection.
      if (!panMoved) clearSelection();
    }
  });
})();
</script>
